# Needs data/benchmarks/nanobody/, which `make setup` (scripts/download_assets.sh) downloads from
# Hugging Face (nvidia/RFD4-Proteina, benchmarks/). It is not stored in git or shipped in the PyPI package.
dataset:
  _target_: rfproteina.inference_utils.datasets.DesignProblemDataset
  dir_path_or_file_paths: ${oc.env:PROJECT_ROOT}/data/benchmarks/nanobody
  num_replicates: 50
  transform:
    _target_: rfproteina.datapipes.pipeline.build_design_validation_pipeline
    metrics_tags:
      - design
      - antibody
      - 3d_coordinate_conditioning
      - internal_coordinate_conditioning
      - hotspot_conditioning
